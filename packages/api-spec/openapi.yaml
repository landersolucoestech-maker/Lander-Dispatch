components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    AuthUser:
      type: object
      required:
      - id
      - email
      - firstName
      - lastName
      - profileImageUrl
      properties:
        id:
          type: string
        email:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        profileImageUrl:
          type:
          - string
          - 'null'
    AuthUserEnvelope:
      type: object
      required:
      - user
      properties:
        user:
          oneOf:
          - $ref: '#/components/schemas/AuthUser'
          - type: 'null'
    PaginationMeta:
      type: object
      required:
      - page
      - pageSize
      - total
      - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    DashboardKpis:
      type: object
      required:
      - activeCarriers
      - inactiveCarriers
      - loadsBooked
      - monthlyRevenue
      properties:
        activeCarriers:
          type: integer
        inactiveCarriers:
          type: integer
        loadsBooked:
          type: integer
        monthlyRevenue:
          type: number
    ActivityItem:
      type: object
      required:
      - id
      - description
      - entityType
      - entityId
      - createdAt
      properties:
        id:
          type: string
        description:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        createdAt:
          type: string
          format: date-time
    AlertItem:
      type: object
      required:
      - id
      - alertType
      - description
      - priority
      - relatedEntityType
      - relatedEntityId
      properties:
        id:
          type: string
        alertType:
          type: string
        description:
          type: string
        priority:
          type: string
        relatedEntityType:
          type: string
        relatedEntityId:
          type: string
        dueDate:
          type:
          - string
          - 'null'
          format: date
    Carrier:
      type: object
      required:
      - id
      - companyName
      - status
