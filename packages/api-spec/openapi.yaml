openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Lander Dispatch API
servers:
- url: /api
  description: Base API path
tags:
- name: health
  description: Health operations
- name: Auth
  description: Authentication endpoints
- name: Dashboard
  description: Dashboard KPIs and activity
- name: Carriers
  description: Carrier management
- name: Brokers
  description: Broker management
- name: Loads
  description: Load management
- name: CRM
  description: CRM contacts and leads
- name: Invoices
  description: Invoice management
- name: Transactions
  description: Transaction management
- name: ProfitLoss
  description: Profit and loss reporting
- name: Settings
  description: Application settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
      - health
      summary: Health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/user:
    get:
      tags:
      - Auth
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
      - $ref: '#/components/parameters/AuthorizationSessionHeader'
      - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags:
      - Auth
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Redirect to OIDC
  /callback:
    get:
      tags:
      - Auth
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: iss
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Redirect on success
  /logout:
    get:
      tags:
      - Auth
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
      - $ref: '#/components/parameters/AuthorizationSessionHeader'
      - $ref: '#/components/parameters/SessionCookie'
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
          default: /
      responses:
        '302':
          description: Redirect to OIDC logout
  /dashboard/kpis:
    get:
      tags:
      - Dashboard
      operationId: getDashboardKpis
      summary: Get dashboard KPI metrics
      responses:
        '200':
          description: KPI data
          content:
            application/json:
              schema:
