  /carriers:
    get:
      tags:
      - Carriers
      operationId: listCarriers
      summary: List carriers
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Paginated carrier list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierListResponse'
    post:
      tags:
      - Carriers
      operationId: createCarrier
      summary: Create a carrier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrier'
  /carriers/{carrierId}:
    get:
      tags:
      - Carriers
      operationId: getCarrier
      summary: Get a carrier by ID
      parameters:
      - name: carrierId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Carrier detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrier'
    patch:
      tags:
      - Carriers
      operationId: updateCarrier
      summary: Update a carrier
      parameters:
      - name: carrierId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrier'
    delete:
      tags:
      - Carriers
      operationId: deleteCarrier
      summary: Delete a carrier
      parameters:
      - name: carrierId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
  /carriers/overview:
