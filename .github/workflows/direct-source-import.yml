name: Direct validated source import

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-source-import-dev
  cancel-in-progress: false

jobs:
  import:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Download and validate source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          archive=/tmp/lander-dispatch.tar.xz
          curl --fail --location \
            --retry 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            --header 'bypass-tunnel-reminder: true' \
            --output "$archive" \
            'https://lander-dispatch-source-20260804.loca.lt/ld_min.tar.xz'
          test "$(stat -c '%s' "$archive")" = '178988'
          test "$(sha256sum "$archive" | awk '{print $1}')" = '9340fa2a1d9827291ebba5356de6810602cc09e5d3668908d0938ab1c5428344'
          xz --test "$archive"

      - name: Replace bootstrap with project source
        shell: bash
        run: |
          set -Eeuo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          mkdir -p "$workdir/extracted"
          tar -xJf /tmp/lander-dispatch.tar.xz -C "$workdir/extracted"

          source_root="$workdir/extracted"
          mapfile -t top_entries < <(find "$workdir/extracted" -mindepth 1 -maxdepth 1 -printf '%p\n')
          if [ "${#top_entries[@]}" -eq 1 ] && [ -d "${top_entries[0]}" ]; then
            source_root="${top_entries[0]}"
          fi

          test -f "$source_root/package.json"
          test -f "$source_root/pnpm-lock.yaml"
          test -d "$source_root/apps/web"
          test -f "$source_root/apps/web/package.json"
          test -d "$source_root/server"
          test -f "$source_root/server/package.json"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.bootstrap' \
            ! -name '.github' \
            -exec rm -rf {} +

          shopt -s dotglob nullglob
          for entry in "$source_root"/*; do
            cp -a "$entry" .
          done
          shopt -u dotglob nullglob

          rm -rf .bootstrap
          rm -f THIS_FILE_SHOULD_NOT_EXIST
          rm -f .github/workflows/direct-source-import.yml
          rm -f .github/workflows/bootstrap-v5.yml
          rm -f .github/workflows/bootstrap-import.yml
          rm -f .github/workflows/import-bootstrap-v2.yml
          rm -f .github/workflows/import-bootstrap.yml

          find . -type f \( \
            -name '.env' -o \
            -name '.env.local' -o \
            -name '.env.*.local' -o \
            -name '.replit' -o \
            -name 'replit.nix' \
          \) -delete

          find . -type d \( \
            -name node_modules -o \
            -name dist -o \
            -name build -o \
            -name coverage -o \
            -name .turbo -o \
            -name .cache \
          \) -prune -exec rm -rf {} + || true

          test -f package.json
          test -f pnpm-lock.yaml
          test -d apps/web
          test -f apps/web/package.json
          test -d server
          test -f server/package.json
          test ! -d .bootstrap
          test ! -e THIS_FILE_SHOULD_NOT_EXIST

      - name: Commit project to dev
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: import Lander Dispatch source project"
          git push origin HEAD:dev
