name: Import validated Lander Dispatch source

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/bootstrap-import.yml"
      - ".bootstrap/source-v5/**"
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validated-source-import-dev
  cancel-in-progress: false

jobs:
  import-source:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.head_ref == 'dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f .bootstrap/source-v5/manifest.json

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          export WORKDIR="$workdir"

          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          source_dir = Path('.bootstrap/source-v5')
          manifest = json.loads((source_dir / 'manifest.json').read_text(encoding='utf-8'))
          chunks = manifest['chunks']
          if len(chunks) != 18:
              raise SystemExit(f'Expected 18 chunks, found {len(chunks)}')

          archive_path = Path(os.environ['WORKDIR']) / 'source.tar.xz'
          with archive_path.open('wb') as archive:
              for item in chunks:
                  path = source_dir / item['name']
                  if not path.is_file():
                      raise SystemExit(f'Missing source chunk: {path}')
                  encoded = ''.join(path.read_text(encoding='ascii').split())
                  raw = base64.b64decode(encoded, validate=True)
                  if len(raw) != item['binary_size']:
                      raise SystemExit(f'Invalid size for {item["name"]}: {len(raw)}')
                  digest = hashlib.sha256(raw).hexdigest()
                  if digest != item['binary_sha256']:
                      raise SystemExit(f'Checksum mismatch for {item["name"]}: {digest}')
                  archive.write(raw)

          archive = archive_path.read_bytes()
          if len(archive) != manifest['archive_size']:
              raise SystemExit(f'Invalid archive size: {len(archive)}')
          digest = hashlib.sha256(archive).hexdigest()
          if digest != manifest['archive_sha256']:
              raise SystemExit(f'Archive checksum mismatch: {digest}')
          print(f'Validated archive SHA-256: {digest}')
          PY

          xz --test "$workdir/source.tar.xz"
          mkdir -p "$workdir/extracted"
          tar -xJf "$workdir/source.tar.xz" -C "$workdir/extracted"

          source_root="$workdir/extracted"
          mapfile -t top_entries < <(find "$workdir/extracted" -mindepth 1 -maxdepth 1 -printf '%p\n')
          if [ "${#top_entries[@]}" -eq 1 ] && [ -d "${top_entries[0]}" ]; then
            source_root="${top_entries[0]}"
          fi

          test -f "$source_root/package.json"
          test -f "$source_root/pnpm-lock.yaml"
          test -f "$source_root/pnpm-workspace.yaml"
          test -d "$source_root/apps/web"
          test -d "$source_root/server"
          test -d "$source_root/packages"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          shopt -s dotglob nullglob
          cp -a "$source_root"/* .
          shopt -u dotglob nullglob

          rm -rf node_modules dist build coverage .turbo .cache
          find . -type d \( -name node_modules -o -name dist -o -name build -o -name coverage -o -name .turbo -o -name .cache \) -prune -exec rm -rf {} + || true
          find . -type f \( -name '.env' -o -name '.env.local' -o -name '.env.*.local' \) -delete
          find . -type f \( -name '.replit' -o -name 'replit.nix' -o -name 'replit.md' \) -delete

          test -f package.json
          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test -d apps/web
          test -d server
          test -d packages
          test ! -d .bootstrap

          file_count="$(find . -path ./.git -prune -o -type f -print | wc -l)"
          test "$file_count" -ge 100
          echo "Validated project files: $file_count"

      - name: Commit imported project to dev
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "chore: import Lander Dispatch source project"
          git push origin HEAD:dev
