name: Bootstrap source import

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/bootstrap-import.yml"
      - ".bootstrap/source-v3/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-source-import-dev
  cancel-in-progress: false

jobs:
  import-source:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Reconstruct and extract source
        shell: bash
        run: |
          set -Eeuo pipefail

          test -d .bootstrap/source-v3
          mapfile -t parts < <(find .bootstrap/source-v3 -maxdepth 1 -type f -name 'part*' -printf '%f\n' | sort -V)
          test "${#parts[@]}" -gt 0

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          : > "$workdir/source.b64"
          for part in "${parts[@]}"; do
            tr -d '\r\n' < ".bootstrap/source-v3/$part" >> "$workdir/source.b64"
          done

          base64 --decode "$workdir/source.b64" > "$workdir/source.tar.xz"
          xz -t "$workdir/source.tar.xz"
          mkdir -p "$workdir/extracted"
          tar -xJf "$workdir/source.tar.xz" -C "$workdir/extracted"

          source_root="$workdir/extracted"
          mapfile -t top_entries < <(find "$workdir/extracted" -mindepth 1 -maxdepth 1 -printf '%p\n')
          if [ "${#top_entries[@]}" -eq 1 ] && [ -d "${top_entries[0]}" ]; then
            source_root="${top_entries[0]}"
          fi

          test -f "$source_root/package.json"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.bootstrap' \
            ! -name '.github' \
            -exec rm -rf {} +

          shopt -s dotglob nullglob
          for entry in "$source_root"/*; do
            cp -a "$entry" .
          done
          shopt -u dotglob nullglob

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

          rm -rf node_modules dist build coverage .turbo .cache
          find . -type d \( -name node_modules -o -name dist -o -name build -o -name coverage -o -name .turbo -o -name .cache \) -prune -exec rm -rf {} + || true
          find . -type f \( -name '.env' -o -name '.env.local' -o -name '.env.*.local' \) -delete
          find . -type f \( -name '.replit' -o -name 'replit.nix' \) -delete

          test -f package.json
          test -f pnpm-lock.yaml
          test -d apps/web
          test -d server

          if [ -d .bootstrap ]; then
            echo 'Bootstrap directory still exists' >&2
            exit 1
          fi

      - name: Commit imported project
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: import Lander Dispatch source project"
          git push origin HEAD:dev
