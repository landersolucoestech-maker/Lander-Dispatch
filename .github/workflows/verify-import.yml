name: Verify imported project

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-imported-project-dev
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Validate project root
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f package.json
          test -f pnpm-lock.yaml
          test -d apps/web
          test -f apps/web/package.json
          test -d server
          test -f server/package.json
          test ! -d .bootstrap
          test ! -e THIS_FILE_SHOULD_NOT_EXIST
          test ! -e .github/workflows/bootstrap-v5.yml
          test ! -e .github/workflows/bootstrap-import.yml
          test ! -e .github/workflows/import-bootstrap-v2.yml
          test ! -e .github/workflows/import-bootstrap.yml
          if find . -type f \( -name '.env' -o -name '.env.local' -o -name '.env.*.local' -o -name '.replit' -o -name 'replit.nix' \) -print -quit | grep -q .; then
            echo 'Forbidden local or Replit file found.' >&2
            exit 1
          fi
      - name: Record successful import
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .github/IMPORT_COMPLETE <<'EOF'
          Lander Dispatch source import validated on branch dev.

          Required root structure:
          - package.json
          - pnpm-lock.yaml
          - apps/web/package.json
          - server/package.json

          Bootstrap staging files and Replit/local environment artifacts are absent.
          No promotion to staging or prod was performed.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/IMPORT_COMPLETE
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record validated source import"
          git push origin HEAD:dev
