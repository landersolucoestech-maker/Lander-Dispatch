name: Dev frontend Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for GitHub Pages
        env:
          BASE_PATH: /Lander-Dispatch/
          VITE_MOCKUP_DATA: "true"
        run: pnpm --filter @workspace/lander-dispatch build

      - name: Install Pages browser smoke runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/lander-pages-playwright
          mkdir -p /tmp/lander-pages-playwright
          cd /tmp/lander-pages-playwright
          npm init --yes >/dev/null
          npm install --no-save --no-package-lock @playwright/test@1.61.1
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start built Pages preview
        shell: bash
        env:
          PORT: 3001
          BASE_PATH: /Lander-Dispatch/
        run: |
          set -Eeuo pipefail
          : > /tmp/lander-pages-preview.log
          nohup pnpm --filter @workspace/lander-dispatch serve > /tmp/lander-pages-preview.log 2>&1 &
          echo $! > /tmp/lander-pages-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/Lander-Dispatch/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lander-pages-preview.log
          exit 1

      - name: Verify built Pages preview in Chromium
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:3001
          PLAYWRIGHT_PACKAGE_JSON: /tmp/lander-pages-playwright/package.json
          PAGES_PREVIEW_SMOKE: "true"
        run: |
          set -Eeuo pipefail
          /tmp/lander-pages-playwright/node_modules/.bin/playwright test \
            e2e/pages-preview.spec.mjs \
            --config ./playwright.config.mjs

      - name: Print Pages preview log on failure
        if: failure()
        run: cat /tmp/lander-pages-preview.log 2>/dev/null || true

      - name: Add SPA fallback
        run: cp apps/web/dist/public/index.html apps/web/dist/public/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
