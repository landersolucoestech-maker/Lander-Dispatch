name: Import Lander Dispatch source v2

on:
  push:
    branches:
      - dev
    paths:
      - .bootstrap/IMPORT_READY_V2

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/lander-dispatch.tar.xz
          rm -f "$archive"
          touch "$archive"

          # The bootstrap parts may have been encoded independently. Decode each
          # part in filename order and append the resulting binary bytes.
          for part in .bootstrap/parts/part*; do
            base64 --decode "$part" >> "$archive"
          done

          # Compatibility fallback for a single Base64 stream split into files.
          if ! xz --test "$archive"; then
            cat .bootstrap/parts/part* \
              | LC_ALL=C tr -cd 'A-Za-z0-9+/=' \
              | base64 --decode \
              > "$archive"
          fi

          test -s "$archive"
          xz --test "$archive"
          mkdir -p /tmp/lander-dispatch-import
          tar -xJf "$archive" -C /tmp/lander-dispatch-import
          test -f /tmp/lander-dispatch-import/ld_bootstrap/package.json
          test -f /tmp/lander-dispatch-import/ld_bootstrap/README.md
          test -d /tmp/lander-dispatch-import/ld_bootstrap/apps
          test -d /tmp/lander-dispatch-import/ld_bootstrap/server

      - name: Replace bootstrap files with project source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .bootstrap \
            -exec rm -rf {} +
          cp -a /tmp/lander-dispatch-import/ld_bootstrap/. .
          rm -rf .bootstrap
          rm -f .github/workflows/import-bootstrap.yml
          rm -f .github/workflows/import-bootstrap-v2.yml

      - name: Commit imported project to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --stat
          git commit -m "chore: import Lander Dispatch source"
          git push origin dev
