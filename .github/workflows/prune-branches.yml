name: Prune non-default branches

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/prune-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-default legacy ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10")
          for branch in dev-pages-test __noop__ staging __canonical_dev_tmp__; do
            code="$(curl -sS -L -o /tmp/response.json -w "%{http_code}" -X DELETE "${auth[@]}" "$api/git/refs/heads/$branch")"
            echo "DELETE $branch -> HTTP $code"
            if [[ "$code" != "204" && "$code" != "422" ]]; then
              cat /tmp/response.json || true
              exit 1
            fi
          done
