name: Contract alignment codemod

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/contract-alignment-codemod.yml

permissions:
  contents: write

jobs:
  align-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align OpenAPI and frontend calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          spec_path = root / 'packages/api-spec/openapi.yaml'
          spec = spec_path.read_text()

          load_block = '''    # Load
              LoadVehicle:
                type: object
                required: [vehicleNumber]
                properties:
                  vehicleNumber:
                    type: integer
                  year:
                    type: [string, 'null']
                  make:
                    type: [string, 'null']
                  model:
                    type: [string, 'null']
                  type:
                    type: [string, 'null']
                  color:
                    type: [string, 'null']
                  plate:
                    type: [string, 'null']
                  vin:
                    type: [string, 'null']
                  lotNumber:
                    type: [string, 'null']
                  buyerNumber:
                    type: [string, 'null']
                  additionalInfo:
                    type: [string, 'null']
              Load:
                type: object
                required: [id, loadId, status, createdAt]
                properties:
                  id: { type: string }
                  loadId: { type: string }
                  carrierId: { type: [string, 'null'] }
                  carrierName: { type: [string, 'null'] }
                  brokerId: { type: [string, 'null'] }
                  brokerName: { type: [string, 'null'] }
                  status: { type: string }
                  dispatchDate: { type: [string, 'null'], format: date }
                  pickupName: { type: [string, 'null'] }
                  pickupAddress: { type: [string, 'null'] }
                  pickupCity: { type: [string, 'null'] }
                  pickupState: { type: [string, 'null'] }
                  pickupZip: { type: [string, 'null'] }
                  pickupPhone: { type: [string, 'null'] }
                  pickupContactName: { type: [string, 'null'] }
                  pickupEmail: { type: [string, 'null'] }
                  pickupEstimated: { type: [string, 'null'], format: date }
                  pickupDeadline: { type: [string, 'null'], format: date }
                  deliveryName: { type: [string, 'null'] }
                  deliveryAddress: { type: [string, 'null'] }
                  deliveryCity: { type: [string, 'null'] }
                  deliveryState: { type: [string, 'null'] }
                  deliveryZip: { type: [string, 'null'] }
                  deliveryPhone: { type: [string, 'null'] }
                  deliveryContactName: { type: [string, 'null'] }
                  deliveryEmail: { type: [string, 'null'] }
                  deliveryEstimated: { type: [string, 'null'], format: date }
                  deliveryDeadline: { type: [string, 'null'], format: date }
                  miles: { type: [number, 'null'] }
                  rate: { type: [number, 'null'] }
                  carrierPay: { type: [number, 'null'] }
                  fuelSurcharge: { type: [number, 'null'] }
                  ratePerMile: { type: [number, 'null'] }
                  freightType: { type: [string, 'null'] }
                  equipmentType: { type: [string, 'null'] }
                  weight: { type: [number, 'null'] }
                  paymentMethod: { type: [string, 'null'] }
                  paymentStatus: { type: [string, 'null'] }
                  vehicles:
                    type: array
                    items: { $ref: '#/components/schemas/LoadVehicle' }
                  dispatchInstructions: { type: [string, 'null'] }
                  pickupInstructions: { type: [string, 'null'] }
                  deliveryInstructions: { type: [string, 'null'] }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: [string, 'null'], format: date-time }
              LoadInput:
                type: object
                properties:
                  loadId: { type: string }
                  carrierId: { type: string }
                  brokerId: { type: string }
                  status: { type: string }
                  dispatchDate: { type: string }
                  pickupName: { type: string }
                  pickupAddress: { type: string }
                  pickupCity: { type: string }
                  pickupState: { type: string }
                  pickupZip: { type: string }
                  pickupPhone: { type: string }
                  pickupContactName: { type: string }
                  pickupEmail: { type: string }
                  pickupEstimated: { type: string }
                  pickupDeadline: { type: string }
                  deliveryName: { type: string }
                  deliveryAddress: { type: string }
                  deliveryCity: { type: string }
                  deliveryState: { type: string }
                  deliveryZip: { type: string }
                  deliveryPhone: { type: string }
                  deliveryContactName: { type: string }
                  deliveryEmail: { type: string }
                  deliveryEstimated: { type: string }
                  deliveryDeadline: { type: string }
                  miles: { type: number }
                  rate: { type: number }
                  carrierPay: { type: number }
                  fuelSurcharge: { type: number }
                  freightType: { type: string }
                  equipmentType: { type: string }
                  weight: { type: number }
                  paymentMethod: { type: string }
                  paymentStatus: { type: string }
                  vehicles:
                    type: array
                    items: { $ref: '#/components/schemas/LoadVehicle' }
                  dispatchInstructions: { type: string }
                  pickupInstructions: { type: string }
                  deliveryInstructions: { type: string }
              LoadUpdate:
                type: object
                properties:
                  carrierId: { type: string }
                  brokerId: { type: string }
                  status: { type: string }
                  dispatchDate: { type: string }
                  pickupName: { type: string }
                  pickupAddress: { type: string }
                  pickupCity: { type: string }
                  pickupState: { type: string }
                  pickupZip: { type: string }
                  pickupPhone: { type: string }
                  pickupContactName: { type: string }
                  pickupEmail: { type: string }
                  pickupEstimated: { type: string }
                  pickupDeadline: { type: string }
                  deliveryName: { type: string }
                  deliveryAddress: { type: string }
                  deliveryCity: { type: string }
                  deliveryState: { type: string }
                  deliveryZip: { type: string }
                  deliveryPhone: { type: string }
                  deliveryContactName: { type: string }
                  deliveryEmail: { type: string }
                  deliveryEstimated: { type: string }
                  deliveryDeadline: { type: string }
                  miles: { type: number }
                  rate: { type: number }
                  carrierPay: { type: number }
                  fuelSurcharge: { type: number }
                  freightType: { type: string }
                  equipmentType: { type: string }
                  weight: { type: number }
                  paymentMethod: { type: string }
                  paymentStatus: { type: string }
                  vehicles:
                    type: array
                    items: { $ref: '#/components/schemas/LoadVehicle' }
                  dispatchInstructions: { type: string }
                  pickupInstructions: { type: string }
                  deliveryInstructions: { type: string }
              LoadListResponse:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Load' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

          '''.replace('          ', '')

          contact_block = '''    # CRM Contact
              CrmContact:
                type: object
                required: [id, companyName, status, createdAt]
                properties:
                  id: { type: string }
                  companyName: { type: string }
                  contactType: { type: [string, 'null'] }
                  status: { type: string }
                  priority: { type: [string, 'null'] }
                  rating: { type: [number, 'null'] }
                  primaryContactName: { type: [string, 'null'] }
                  primaryPhoneNumber: { type: [string, 'null'] }
                  primaryPhoneNumber2: { type: [string, 'null'] }
                  email: { type: [string, 'null'] }
                  website: { type: [string, 'null'] }
                  emergencyContactName: { type: [string, 'null'] }
                  emergencyPhoneNumber: { type: [string, 'null'] }
                  emergencyPhoneNumber2: { type: [string, 'null'] }
                  streetAddress: { type: [string, 'null'] }
                  city: { type: [string, 'null'] }
                  state: { type: [string, 'null'] }
                  zipCode: { type: [string, 'null'] }
                  coverageArea: { type: [string, 'null'] }
                  businessHours: { type: [string, 'null'] }
                  emergencyService: { type: [boolean, 'null'] }
                  services: { type: [string, 'null'] }
                  brokerType: { type: [string, 'null'] }
                  mcNumber: { type: [string, 'null'] }
                  usdotNumber: { type: [string, 'null'] }
                  coverage: { type: [string, 'null'] }
                  freightTypes: { type: array, items: { type: string } }
                  coverageStates: { type: array, items: { type: string } }
                  paymentTerms: { type: [string, 'null'] }
                  paymentDays: { type: [integer, 'null'] }
                  quickPay: { type: [boolean, 'null'] }
                  quickPayFee: { type: [number, 'null'] }
                  factoringAccepted: { type: [string, 'null'] }
                  factoringConditions: { type: [string, 'null'] }
                  onboardingStatus: { type: [string, 'null'] }
                  carrierType: { type: [string, 'null'] }
                  einNumber: { type: [string, 'null'] }
                  authorityStatus: { type: [string, 'null'] }
                  insuranceExpiration: { type: [string, 'null'], format: date }
                  ratePerMile: { type: [number, 'null'] }
                  companyAddress: { type: [string, 'null'] }
                  companyCity: { type: [string, 'null'] }
                  companyState: { type: [string, 'null'] }
                  companyZipCode: { type: [string, 'null'] }
                  factoringCompany: { type: [string, 'null'] }
                  factoringFee: { type: [number, 'null'] }
                  bankName: { type: [string, 'null'] }
                  accountHolder: { type: [string, 'null'] }
                  accountNumber: { type: [string, 'null'] }
                  routingNumber: { type: [string, 'null'] }
                  bankAddress: { type: [string, 'null'] }
                  bankCity: { type: [string, 'null'] }
                  bankState: { type: [string, 'null'] }
                  bankZipCode: { type: [string, 'null'] }
                  zelleAccount: { type: [string, 'null'] }
                  cashAppAccount: { type: [string, 'null'] }
                  operatingStates: { type: array, items: { type: string } }
                  areaOfOperation: { type: [string, 'null'] }
                  serviceTypes: { type: array, items: { type: string } }
                  weeklyMinimumAmount: { type: [number, 'null'] }
                  totalTripsPerWeek: { type: [integer, 'null'] }
                  lastLoad: { type: [string, 'null'], format: date }
                  fleetEquipment: { type: array, items: { type: object, additionalProperties: true } }
                  lastContact: { type: [string, 'null'], format: date }
                  tags: { type: array, items: { type: string } }
                  notes: { type: [string, 'null'] }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: [string, 'null'], format: date-time }
              CrmContactInput:
                type: object
                required: [companyName]
                properties:
                  companyName: { type: string }
                  contactType: { type: string }
                  status: { type: string }
                  priority: { type: string }
                  rating: { type: number }
                  primaryContactName: { type: string }
                  primaryPhoneNumber: { type: string }
                  primaryPhoneNumber2: { type: string }
                  email: { type: string }
                  website: { type: string }
                  emergencyContactName: { type: string }
                  emergencyPhoneNumber: { type: string }
                  emergencyPhoneNumber2: { type: string }
                  streetAddress: { type: string }
                  city: { type: string }
                  state: { type: string }
                  zipCode: { type: string }
                  coverageArea: { type: string }
                  businessHours: { type: string }
                  emergencyService: { type: boolean }
                  services: { type: string }
                  brokerType: { type: string }
                  mcNumber: { type: string }
                  usdotNumber: { type: string }
                  coverage: { type: string }
                  freightTypes: { type: array, items: { type: string } }
                  coverageStates: { type: array, items: { type: string } }
                  paymentTerms: { type: string }
                  paymentDays: { type: integer }
                  quickPay: { type: boolean }
                  quickPayFee: { type: number }
                  factoringAccepted: { type: string }
                  factoringConditions: { type: string }
                  onboardingStatus: { type: string }
                  carrierType: { type: string }
                  einNumber: { type: string }
                  authorityStatus: { type: string }
                  insuranceExpiration: { type: string }
                  ratePerMile: { type: number }
                  companyAddress: { type: string }
                  companyCity: { type: string }
                  companyState: { type: string }
                  companyZipCode: { type: string }
                  factoringCompany: { type: string }
                  factoringFee: { type: number }
                  bankName: { type: string }
                  accountHolder: { type: string }
                  accountNumber: { type: string }
                  routingNumber: { type: string }
                  bankAddress: { type: string }
                  bankCity: { type: string }
                  bankState: { type: string }
                  bankZipCode: { type: string }
                  zelleAccount: { type: string }
                  cashAppAccount: { type: string }
                  operatingStates: { type: array, items: { type: string } }
                  areaOfOperation: { type: string }
                  serviceTypes: { type: array, items: { type: string } }
                  weeklyMinimumAmount: { type: number }
                  totalTripsPerWeek: { type: integer }
                  lastLoad: { type: string }
                  fleetEquipment: { type: array, items: { type: object, additionalProperties: true } }
                  lastContact: { type: string }
                  tags: { type: array, items: { type: string } }
                  notes: { type: string }
              CrmContactUpdate:
                allOf:
                  - $ref: '#/components/schemas/CrmContactInput'
              CrmContactListResponse:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CrmContact' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

          '''.replace('          ', '')

          load_start = spec.index('    # Load\n')
          contact_start = spec.index('    # CRM Contact\n', load_start)
          lead_start = spec.index('    # CRM Lead\n', contact_start)
          spec = spec[:load_start] + load_block + contact_block + spec[lead_start:]

          carrier_old = """        routingNumberLast4:\n          type: [string, 'null']\n        bankCity:\n          type: [string, 'null']\n        bankState:\n          type: [string, 'null']\n"""
          carrier_new = """        routingNumberLast4:\n          type: [string, 'null']\n        bankAddress:\n          type: [string, 'null']\n        bankCity:\n          type: [string, 'null']\n        bankState:\n          type: [string, 'null']\n        bankZip:\n          type: [string, 'null']\n"""
          if spec.count(carrier_old) != 1:
            raise SystemExit(f'Unexpected Carrier bank response marker count: {spec.count(carrier_old)}')
          spec = spec.replace(carrier_old, carrier_new, 1)
          spec_path.write_text(spec)

          hooks = [
              'useListInvoices', 'useGetProfitLoss', 'useListTransactions',
              'useListBrokers', 'useListCarriers', 'useListCrmContacts',
              'useListCrmLeads', 'useListLoads'
          ]
          option_keys = ('queryKey', 'enabled', 'staleTime', 'gcTime', 'retry', 'refetchInterval')

          def transform_nested(text, hook):
              pattern = re.compile(rf'(?P<indent>^[ \t]*){hook}\(\{{\s*query:\s*\{{(?P<body>.*?)\}}\s*\}}\)', re.M | re.S)
              def repl(match):
                  indent = match.group('indent')
                  entries = [line.strip().rstrip(',') for line in match.group('body').splitlines() if line.strip()]
                  params, options = [], []
                  for entry in entries:
                      key = entry.split(':', 1)[0].strip()
                      (options if key in option_keys else params).append(entry)
                  if not params:
                      params_text = '{}'
                  else:
                      params_text = '{\n' + '\n'.join(f'{indent}  {entry},' for entry in params) + f'\n{indent}}}'
                  if options:
                      options_text = '{\n' + f'{indent}  query: {{\n' + '\n'.join(f'{indent}    {entry},' for entry in options) + f'\n{indent}  }},\n{indent}}}'
                      return f'{indent}{hook}(\n{indent}  {params_text},\n{indent}  {options_text},\n{indent})'
                  return f'{indent}{hook}({params_text})'
              return pattern.sub(repl, text)

          for path in (root / 'apps/web/src').rglob('*.tsx'):
              text = path.read_text()
              original = text
              for hook in hooks:
                  text = transform_nested(text, hook)
                  text = re.sub(rf'({hook}\(\{{\s*)query:\s*(?!\{{)', r'\1search: ', text)
              text = re.sub(
                  r'useGetCarrier\(([^,\n]+),\s*\{\s*enabled:\s*([^}]+)\}\)',
                  r'useGetCarrier(\1, { query: { enabled: \2 } })',
                  text,
              )
              if text != original:
                  path.write_text(text)

          replacements = {
            'apps/web/src/modules/accounting/components/InvoiceFormModal.tsx': [
              ('    const carrier = carriersData?.data.find((c: any) => c.id === carrierId);\n    const driverName = carrier?.driver?.name ?? carrier?.driverName ?? "";\n    setForm((previous) => ({ ...previous, carrierId, driverName }));',
               '    setForm((previous) => ({ ...previous, carrierId, driverName: "" }));'),
            ],
            'apps/web/src/modules/carriers/components/CarrierFormModal.tsx': [
              ('        accountNumber: initialData.accountNumber ?? "",', '        accountNumber: "",'),
              ('        routingNumber: initialData.routingNumber ?? "",', '        routingNumber: "",'),
              ('  const { data: contactsData } = useListCrmContacts({ query: { pageSize: 200 } as any });\n  const contacts = contactsData?.contacts ?? [];',
               '  const { data: contactsData } = useListCrmContacts({ pageSize: 200 });\n  const contacts = contactsData?.data ?? [];'),
            ],
            'apps/web/src/modules/crm/components/CarrierContactForm.tsx': [
              ('import type { FleetEquipment } from "@workspace/db";', 'import type { FleetEquipment } from "../types/fleet-equipment";'),
            ],
            'apps/web/src/modules/crm/components/ContactFormModal.tsx': [
              ('      services: config?.showServices ? prev.services : "",', '      servicesProvided: config?.showServices ? prev.servicesProvided : "",'),
            ],
            'apps/web/src/modules/crm/components/DriverFormModal.tsx': [
              ('function C4({ children }: { children: React.ReactNode })', 'function C4({ children }: { children?: React.ReactNode })'),
              ('function C6({ children }: { children: React.ReactNode })', 'function C6({ children }: { children?: React.ReactNode })'),
            ],
          }

          for name, pairs in replacements.items():
              path = root / name
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected snippet in {name}: {old[:80]}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Commit contract alignment
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/api-spec/openapi.yaml apps/web/src
          git commit -m "fix: align frontend models with OpenAPI contracts"
          git push origin HEAD:dev
