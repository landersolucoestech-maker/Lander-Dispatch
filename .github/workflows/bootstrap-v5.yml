name: Final source reconstruction

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-source-reconstruction-dev
  cancel-in-progress: false

jobs:
  reconstruct:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import itertools
          import pathlib
          import re
          import sys

          ROOT = pathlib.Path('.')
          SOURCE = ROOT / '.bootstrap' / 'source-v5'
          OUTPUT = pathlib.Path('/tmp/lander-dispatch.tar.xz')
          EXPECTED_SIZE = 178_988
          EXPECTED_SHA256 = '9340fa2a1d9827291ebba5356de6810602cc09e5d3668908d0938ab1c5428344'
          PREFIX_PARTS = [SOURCE / f'part{i:03d}' for i in range(17)]
          B64_RE = re.compile(rb'[^A-Za-z0-9+/=]')

          def strict_decode(path: pathlib.Path) -> bytes:
              text = b''.join(path.read_bytes().split())
              return base64.b64decode(text, validate=True)

          def flexible_decodes(raw: bytes):
              seen: set[str] = set()
              variants = [b''.join(raw.split()), B64_RE.sub(b'', raw)]
              for variant in variants:
                  for offset in range(4):
                      data = variant[offset:]
                      if not data:
                          continue
                      data = data.rstrip(b'=')
                      data += b'=' * ((4 - len(data) % 4) % 4)
                      try:
                          decoded = base64.b64decode(data, validate=False)
                      except Exception:
                          continue
                      digest = hashlib.sha256(decoded).hexdigest()
                      if digest not in seen:
                          seen.add(digest)
                          yield decoded

          def valid_archive(data: bytes) -> bool:
              return (
                  len(data) == EXPECTED_SIZE
                  and hashlib.sha256(data).hexdigest() == EXPECTED_SHA256
              )

          for path in PREFIX_PARTS:
              if not path.is_file():
                  raise SystemExit(f'Missing required v5 chunk: {path}')

          decoded_prefix_parts = [strict_decode(path) for path in PREFIX_PARTS]
          for index, part in enumerate(decoded_prefix_parts):
              if len(part) != 10_000:
                  raise SystemExit(
                      f'Invalid decoded size for part{index:03d}: {len(part)}'
                  )

          prefix = b''.join(decoded_prefix_parts)
          if len(prefix) != 170_000:
              raise SystemExit(f'Invalid prefix size: {len(prefix)}')

          direct_tail = SOURCE / 'part017'
          if direct_tail.is_file():
              candidate = prefix + strict_decode(direct_tail)
              if valid_archive(candidate):
                  OUTPUT.write_bytes(candidate)
                  print('Archive recovered using source-v5/part017.')
                  sys.exit(0)

          legacy_dirs = [
              ROOT / '.bootstrap' / 'source-v4',
              ROOT / '.bootstrap' / 'source-v3',
              ROOT / '.bootstrap' / 'parts',
          ]
          legacy_files = sorted(
              [
                  path
                  for directory in legacy_dirs
                  if directory.is_dir()
                  for path in directory.glob('part*')
                  if path.is_file()
              ],
              key=lambda path: (str(path.parent), path.name),
          )

          if not legacy_files:
              raise SystemExit('No legacy chunks are available to recover the final tail.')

          def try_decoded(decoded: bytes, label: str) -> bytes | None:
              missing = EXPECTED_SIZE - len(prefix)

              if len(decoded) == missing:
                  full = prefix + decoded
                  if valid_archive(full):
                      print(f'Archive recovered from exact tail: {label}')
                      return full

              if len(decoded) >= EXPECTED_SIZE and EXPECTED_SHA256 == hashlib.sha256(decoded[:EXPECTED_SIZE]).hexdigest():
                  print(f'Archive recovered as full decoded stream: {label}')
                  return decoded[:EXPECTED_SIZE]

              max_anchor = min(8192, len(prefix), len(decoded))
              for anchor_size in (8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16):
                  if anchor_size > max_anchor:
                      continue
                  anchor = prefix[-anchor_size:]
                  start = 0
                  while True:
                      position = decoded.find(anchor, start)
                      if position < 0:
                          break
                      continuation = decoded[position + anchor_size:]
                      full = prefix + continuation[:missing]
                      if valid_archive(full):
                          print(
                              f'Archive recovered by overlap ({anchor_size} bytes): {label}'
                          )
                          return full
                      start = position + 1

              return None

          for path in legacy_files:
              for number, decoded in enumerate(flexible_decodes(path.read_bytes())):
                  recovered = try_decoded(decoded, f'{path} variant {number}')
                  if recovered is not None:
                      OUTPUT.write_bytes(recovered)
                      sys.exit(0)

          for directory in legacy_dirs:
              files = sorted(directory.glob('part*')) if directory.is_dir() else []
              if not files:
                  continue
              joined = b''.join(path.read_bytes() for path in files)
              for number, decoded in enumerate(flexible_decodes(joined)):
                  recovered = try_decoded(
                      decoded,
                      f'joined stream {directory} variant {number}',
                  )
                  if recovered is not None:
                      OUTPUT.write_bytes(recovered)
                      sys.exit(0)

          decoded_segments: list[tuple[str, bytes]] = []
          for path in legacy_files:
              for number, decoded in enumerate(flexible_decodes(path.read_bytes())):
                  if len(decoded) >= 64:
                      decoded_segments.append((f'{path} variant {number}', decoded))

          frontier: list[tuple[str, bytes]] = [('v5 prefix', prefix)]
          visited = {hashlib.sha256(prefix).hexdigest()}
          for _ in range(4):
              next_frontier: list[tuple[str, bytes]] = []
              for current_label, current in frontier:
                  for segment_label, segment in decoded_segments:
                      for overlap in (8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16):
                          if overlap > len(current) or overlap > len(segment):
                              continue
                          if current[-overlap:] != segment[:overlap]:
                              continue
                          combined = current + segment[overlap:]
                          combined = combined[:EXPECTED_SIZE]
                          if valid_archive(combined):
                              print(
                                  'Archive recovered by chained overlap: '
                                  f'{current_label} -> {segment_label}'
                              )
                              OUTPUT.write_bytes(combined)
                              sys.exit(0)
                          digest = hashlib.sha256(combined).hexdigest()
                          if digest not in visited and len(combined) > len(current):
                              visited.add(digest)
                              next_frontier.append(
                                  (f'{current_label} -> {segment_label}', combined)
                              )
                          break
              frontier = next_frontier[:500]
              if not frontier:
                  break

          raise SystemExit(
              'Unable to reconstruct an archive matching the required size and SHA-256.'
          )
          PY

          test "$(stat -c '%s' /tmp/lander-dispatch.tar.xz)" = "178988"
          test "$(sha256sum /tmp/lander-dispatch.tar.xz | awk '{print $1}')" = "9340fa2a1d9827291ebba5356de6810602cc09e5d3668908d0938ab1c5428344"
          xz --test /tmp/lander-dispatch.tar.xz

      - name: Extract project into dev root
        shell: bash
        run: |
          set -Eeuo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          mkdir -p "$workdir/extracted"
          tar -xJf /tmp/lander-dispatch.tar.xz -C "$workdir/extracted"

          source_root="$workdir/extracted"
          mapfile -t top_entries < <(find "$workdir/extracted" -mindepth 1 -maxdepth 1 -printf '%p\n')
          if [ "${#top_entries[@]}" -eq 1 ] && [ -d "${top_entries[0]}" ]; then
            source_root="${top_entries[0]}"
          fi

          test -f "$source_root/package.json"
          test -f "$source_root/pnpm-lock.yaml"
          test -d "$source_root/apps/web"
          test -d "$source_root/server"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.bootstrap' \
            ! -name '.github' \
            -exec rm -rf {} +

          shopt -s dotglob nullglob
          for entry in "$source_root"/*; do
            cp -a "$entry" .
          done
          shopt -u dotglob nullglob

          rm -rf .bootstrap
          rm -f THIS_FILE_SHOULD_NOT_EXIST
          rm -f .github/workflows/bootstrap-v5.yml
          rm -f .github/workflows/bootstrap-import.yml
          rm -f .github/workflows/import-bootstrap-v2.yml
          rm -f .github/workflows/import-bootstrap.yml

          find . -type f \( \
            -name '.env' -o \
            -name '.env.local' -o \
            -name '.env.*.local' \
          \) -delete
          find . -type f \( -name '.replit' -o -name 'replit.nix' \) -delete
          find . -type d \( \
            -name node_modules -o \
            -name dist -o \
            -name build -o \
            -name coverage -o \
            -name .turbo -o \
            -name .cache \
          \) -prune -exec rm -rf {} + || true

          test -f package.json
          test -f pnpm-lock.yaml
          test -d apps/web
          test -d server
          test ! -d .bootstrap
          test ! -e THIS_FILE_SHOULD_NOT_EXIST

      - name: Commit imported source to dev
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: import Lander Dispatch source project"
          git push origin HEAD:dev
