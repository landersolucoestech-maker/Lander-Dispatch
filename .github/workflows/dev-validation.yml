name: Dev validation

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: dev-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, codegen check, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI clients
        run: pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts

      - name: Verify generated sources are synchronized
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code -- \
            packages/api-client-react/src/generated \
            packages/api-zod/src/generated

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
