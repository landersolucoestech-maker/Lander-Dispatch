name: Dev validation

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: dev-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static and runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_ENV: development
      APP_ENV: development
      HOST: 127.0.0.1
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/lander_dispatch
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      S3_PRIVATE_BUCKET: lander-dispatch-private
      S3_PUBLIC_BUCKETS: lander-dispatch-public
      BANK_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config >/dev/null

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify development seed safeguards
        run: pnpm seed:dev:guard

      - name: Generate OpenAPI clients
        run: pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts

      - name: Verify generated sources are synchronized
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code -- \
            packages/api-client-react/src/generated \
            packages/api-zod/src/generated

      - name: Verify Replit dependencies are absent
        shell: bash
        run: |
          set -Eeuo pipefail
          if git grep -n -i -E '(@replit/|replit-auth|REPL_ID|REPLIT_DOMAINS|replit\.com/oidc)' -- \
            ':!pnpm-lock.yaml' \
            ':!README.md' \
            ':!.github/workflows/dev-validation.yml'; then
            echo 'Replit-specific integration remains in the source tree.' >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Start PostgreSQL and MinIO
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose up -d --wait postgres minio
          docker compose --profile setup run --rm minio-init

      - name: Apply development database schema
        run: pnpm --filter @workspace/db push-force

      - name: Seed realistic development dataset
        if: github.event_name == 'push' && github.ref_name == 'dev'
        env:
          SEED_DEV_CONFIRM: LANDER_DISPATCH_DEV_ONLY
        run: pnpm seed:dev

      - name: Verify development dataset
        if: github.event_name == 'push' && github.ref_name == 'dev'
        env:
          SEED_DEV_CONFIRM: LANDER_DISPATCH_DEV_ONLY
        run: pnpm seed:dev:verify

      - name: Bootstrap disposable CI owner
        env:
          OWNER_EMAIL: ci-owner@localhost.test
          OWNER_PASSWORD: Ci-Owner-Password-2026
          OWNER_FIRST_NAME: CI
          OWNER_LAST_NAME: Owner
        run: pnpm auth:bootstrap-owner

      - name: Start API in loopback bypass mode
        shell: bash
        env:
          AUTH_DISABLED: "true"
        run: |
          set -Eeuo pipefail
          : > /tmp/lander-dispatch-api.log
          nohup node --enable-source-maps ./server/dist/index.mjs > /tmp/lander-dispatch-api.log 2>&1 &
          echo $! > /tmp/lander-dispatch-api.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/lander-dispatch-api.log
          exit 1

      - name: Run loopback and object storage smoke test
        env:
          API_BASE_URL: http://127.0.0.1:5000
        run: node ./scripts/ci-runtime-smoke.mjs

      - name: Run documents and audit smoke test
        env:
          API_BASE_URL: http://127.0.0.1:5000
        run: node ./scripts/ci-documents-audit-smoke.mjs

      - name: Run CRM Lead domain smoke test
        env:
          API_BASE_URL: http://127.0.0.1:5000
        run: node ./scripts/ci-crm-lead-smoke.mjs

      - name: Run generic CRM Contact domain smoke test
        env:
          API_BASE_URL: http://127.0.0.1:5000
        run: node ./scripts/ci-crm-contact-smoke.mjs

      - name: Run dashboard accounting and alert smoke test
        env:
          API_BASE_URL: http://127.0.0.1:5000
        run: node ./scripts/ci-dashboard-smoke.mjs

      - name: Install temporary Playwright Chromium
        if: github.event_name == 'push' && github.ref_name == 'dev'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/lander-playwright
          mkdir -p /tmp/lander-playwright
          cd /tmp/lander-playwright
          npm init --yes >/dev/null
          npm install --no-save --no-package-lock @playwright/test@1.61.1
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start web application for browser E2E
        if: github.event_name == 'push' && github.ref_name == 'dev'
        shell: bash
        env:
          PORT: 3000
          VITE_API_URL: http://127.0.0.1:5000
        run: |
          set -Eeuo pipefail
          : > /tmp/lander-dispatch-web.log
          nohup pnpm --filter @workspace/lander-dispatch dev > /tmp/lander-dispatch-web.log 2>&1 &
          echo $! > /tmp/lander-dispatch-web.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/lander-dispatch-web.log
          exit 1

      - name: Run Playwright browser E2E
        if: github.event_name == 'push' && github.ref_name == 'dev'
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_PACKAGE_JSON: /tmp/lander-playwright/package.json
        run: |
          set -Eeuo pipefail
          /tmp/lander-playwright/node_modules/.bin/playwright test \
            --config ./playwright.config.mjs

      - name: Upload Playwright failure artifacts
        if: failure() && github.event_name == 'push' && github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Restart API with authentication required
        shell: bash
        env:
          AUTH_DISABLED: "false"
        run: |
          set -Eeuo pipefail
          API_PID="$(cat /tmp/lander-dispatch-api.pid)"
          kill "$API_PID"
          wait "$API_PID" 2>/dev/null || true
          rm -f /tmp/lander-dispatch-api.pid

          for attempt in $(seq 1 30); do
            if ! curl --silent --max-time 1 http://127.0.0.1:5000/api/healthz >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "The bypass API process did not release port 5000." >&2
              exit 1
            fi
            sleep 0.5
          done

          : > /tmp/lander-dispatch-api.log
          nohup node --enable-source-maps ./server/dist/index.mjs > /tmp/lander-dispatch-api.log 2>&1 &
          echo $! > /tmp/lander-dispatch-api.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/lander-dispatch-api.log
          exit 1

      - name: Verify operational routes require authentication
        env:
          API_BASE_URL: http://127.0.0.1:5000
        run: node ./scripts/ci-auth-required-smoke.mjs

      - name: Verify real owner login and session revocation
        env:
          API_BASE_URL: http://127.0.0.1:5000
          OWNER_EMAIL: ci-owner@localhost.test
          OWNER_PASSWORD: Ci-Owner-Password-2026
        run: node ./scripts/ci-first-party-auth-smoke.mjs

      - name: Print runtime logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- API log ---'
          cat /tmp/lander-dispatch-api.log 2>/dev/null || true
          echo '--- Web log ---'
          cat /tmp/lander-dispatch-web.log 2>/dev/null || true

      - name: Stop runtime services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/lander-dispatch-web.pid ]; then
            kill "$(cat /tmp/lander-dispatch-web.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/lander-dispatch-api.pid ]; then
            kill "$(cat /tmp/lander-dispatch-api.pid)" 2>/dev/null || true
          fi
          docker compose down --volumes --remove-orphans
