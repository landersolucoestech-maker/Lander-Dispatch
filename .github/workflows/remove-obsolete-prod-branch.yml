name: Remove obsolete prod branch

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/remove-obsolete-prod-branch.yml

permissions:
  contents: write

jobs:
  remove-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete prod branch
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code --heads origin prod >/dev/null 2>&1; then
            git push origin --delete prod
          else
            echo "Branch prod does not exist."
          fi
