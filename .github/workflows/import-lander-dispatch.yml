name: Import Lander Dispatch source

on:
  pull_request:
    branches:
      - staging
    paths:
      - .bootstrap/IMPORT_READY
      - .bootstrap/IMPORT_READY_V2
      - .bootstrap/parts/**

permissions:
  contents: write

jobs:
  import-source:
    if: github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/lander-dispatch.tar.xz
          rm -f "$archive"

          echo "Bootstrap parts:"
          for part in .bootstrap/parts/part*; do
            printf '%s %s bytes\n' "$part" "$(wc -c < "$part")"
          done

          decode_independent_parts() {
            : > "$archive"
            for part in .bootstrap/parts/part*; do
              clean="$(mktemp)"
              LC_ALL=C tr -cd 'A-Za-z0-9+/' < "$part" > "$clean"
              remainder=$(( $(wc -c < "$clean") % 4 ))
              if [ "$remainder" -ne 0 ]; then
                printf '%*s' $((4 - remainder)) '' | tr ' ' '=' >> "$clean"
              fi
              base64 --decode "$clean" >> "$archive"
              rm -f "$clean"
            done
          }

          decode_single_stream() {
            stream="$(mktemp)"
            cat .bootstrap/parts/part* | LC_ALL=C tr -cd 'A-Za-z0-9+/' > "$stream"
            remainder=$(( $(wc -c < "$stream") % 4 ))
            if [ "$remainder" -ne 0 ]; then
              printf '%*s' $((4 - remainder)) '' | tr ' ' '=' >> "$stream"
            fi
            base64 --decode "$stream" > "$archive"
            rm -f "$stream"
          }

          if decode_independent_parts && xz --test "$archive"; then
            echo "Archive reconstructed from independently encoded parts."
          else
            echo "Independent-part decoding did not produce a valid XZ archive; trying one continuous Base64 stream."
            decode_single_stream
            xz --test "$archive"
            echo "Archive reconstructed from one continuous Base64 stream."
          fi

          test -s "$archive"
          mkdir -p /tmp/lander-dispatch-import
          tar -xJf "$archive" -C /tmp/lander-dispatch-import
          test -f /tmp/lander-dispatch-import/ld_bootstrap/package.json
          test -f /tmp/lander-dispatch-import/ld_bootstrap/README.md
          test -d /tmp/lander-dispatch-import/ld_bootstrap/apps
          test -d /tmp/lander-dispatch-import/ld_bootstrap/server

      - name: Replace bootstrap files with project source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            -exec rm -rf {} +
          cp -a /tmp/lander-dispatch-import/ld_bootstrap/. .

      - name: Commit imported project to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --stat
          git commit -m "chore: import Lander Dispatch source"
          git push origin HEAD:dev
